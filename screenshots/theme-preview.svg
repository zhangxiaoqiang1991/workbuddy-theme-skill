    <circle cx="346" cy="78" r="9" fill="#b95f3d"/>
    <text x="144" y="374" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#332b23">Warm Paper</text>
    <text x="144" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#827363">暖纸张与墨色</text>
  </g>

  <g transform="translate(968 176)">
    <defs>
      <linearGradient id="cyber" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0" stop-color="#07111f"/>
        <stop offset=".55" stop-color="#0a1a2c"/>
