    <rect x="144" y="48" width="230" height="280" rx="22" fill="#151d29" stroke="#67e8f9" stroke-opacity=".35"/>
    <rect x="164" y="268" width="190" height="42" rx="12" fill="#0f1722" stroke="#67e8f9" stroke-opacity=".5"/>
    <circle cx="346" cy="78" r="9" fill="#67e8f9"/>
    <text x="144" y="374" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#edf4ff">Focus Night</text>
    <text x="144" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#93a4bb">低干扰深色专注</text>
  </g>

  <g transform="translate(520 176)">
    <rect width="400" height="450" rx="28" fill="#f4efe4"/>
    <rect x="20" y="20" width="104" height="410" rx="18" fill="#fffaf0"/>
    <rect x="144" y="48" width="230" height="280" rx="22" fill="#fffdf7" stroke="#b95f3d" stroke-opacity=".3"/>
