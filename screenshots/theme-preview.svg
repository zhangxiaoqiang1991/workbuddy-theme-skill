<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">WorkBuddy Theme Skill 配色预览</title>
  <desc id="desc">Focus Night、Warm Paper 和 Cyber Lobster 三套主题的抽象界面配色预览。</desc>
  <rect width="1440" height="720" fill="#eceff4"/>
  <text x="72" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="700" fill="#172033">WorkBuddy Theme Skill</text>
  <text x="72" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" fill="#657086">三套内置主题配色预览</text>

  <g transform="translate(72 176)">
    <rect width="400" height="450" rx="28" fill="#090d13"/>
