    <rect width="400" height="450" rx="28" fill="url(#cyber)"/>
    <circle cx="326" cy="74" r="88" fill="#ff6b5f" opacity=".13"/>
    <circle cx="80" cy="352" r="110" fill="#2dd4bf" opacity=".1"/>
    <rect x="20" y="20" width="104" height="410" rx="18" fill="#081626" fill-opacity=".92"/>
